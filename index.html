<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> "flashCard" </title>
        <link rel="preconect" href="https://fonts.google.com/share?selection.family=Indie+Flower">
    </head>
</html>
<body>

  <div class="container">
    <h1>Flashcards</h1>
    <div class="card" id="card">
      <div class="card-inner">
        <div class="card-front">
          <img id="card-image" src="" alt="Imagem do Flashcard">
          <p id="card-question">"o que são propriedades da luz?"</p>
        </div>
        <div class="card-back">
          <p id="card-answer">Resposta</p>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="prev-btn">Anterior</button>
      <button id="flip-btn">Virar Card</button>
      <button id="next-btn">Próximo</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
