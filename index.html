<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Flashcards</h1>
      <p>Clique no card para virar e ver a explicação.</p>
    </header>

    <main class="flashcard-container">
      <div class="card" id="flashcard">

        <div class="card-face card-front">
          <span class="badge">Flashcards</span>
          <div class="img-container">
            <img id="card-img" src="" alt="Imagem da propriedade da luz">
          </div>
          <h2 id="card-title-front">Flashcards</h2>
          <p class="hint">Clique para virar o card</p>
        </div>

        <div class="card-face card-back">
          <h2>Explicação</h2>
          <p id="card-desc">Descrição do fenômeno físico.</p>
          <div class="exemplo-box">
            <strong>Exemplo Prático:</strong>
            <p id="card-example">Exemplo no dia a dia...</p>
          </div>
          <p class="hint"> Clique para voltar</p>
        </div>

      </div>
    </main>

    <footer class="controls">
      <button id="btn-prev" class="btn">&#8592; Anterior</button>
      <span id="card-counter" class="counter">1 / 5</span>
      <button id="btn-next" class="btn">Próximo &#8594;</button>
    </footer>

    <div class="dots-container" id="dots-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
