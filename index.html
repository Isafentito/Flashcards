<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Flashcards: Óptica</h1>

    </header>

    <main>
        <nav class="theme-selector">
            <button onclick="carregarTema('propriedades')">Propriedades da Luz</button>
            <button onclick="carregarTema('reflexao')">Reflexão e Espelhos</button>
            <button onclick="carregarTema('fenomenos')">Fenômenos da Luz</button>
            <button onclick="carregarTema('lentes')">Lentes</button>
            <button onclick="carregarTema('optica_corpo')">Óptica do Corpo Humano</button>
        </nav>

        <section class="flashcard-container" style="display: none;">
            <div class="flashcard" id="flashcard" onclick="virarCard()">
                <div class="card-front">
                    <img id="card-image" src="" alt="Imagem do Flashcard">
                    <h2 id="card-question">Pergunta</h2>
                    <p class="click-hint">Clique para ver a resposta</p>
                </div>
                <div class="card-back">
                    <h2 id="card-answer">Resposta</h2>
                </div>
            </div>
            
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
